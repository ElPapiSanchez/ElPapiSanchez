<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Party Team Reveal!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <div class="bg-shapes" aria-hidden="true"></div>

    <main class="app">
      <header class="hero">
        <div class="party-icons" aria-hidden="true">🎈 🎉 🎂</div>
        <p class="eyebrow">It’s party time!</p>
        <h1>Spin & find your team!</h1>
        <p class="subtitle">
          Pick your name, spin the wheel, and discover your secret squad. Shhh — don’t spoil it for the others!
        </p>
      </header>

      <section id="screen-pick" class="card screen active">
        <label for="name-select" class="label">Who are you?</label>
        <select id="name-select" class="select" disabled>
          <option value="">Loading names…</option>
        </select>
        <button id="btn-reveal" class="btn primary" type="button" disabled>
          Spin the wheel!
        </button>
        <p id="pick-error" class="error" role="alert" hidden></p>
        <p id="remaining-hint" class="hint"></p>
      </section>

      <section id="screen-spin" class="card screen" hidden>
        <p class="spin-label">Good luck, <span id="spin-name"></span>!</p>
        <div class="wheel-wrap">
          <div class="wheel-pointer" aria-hidden="true"></div>
          <canvas id="wheel" width="320" height="320" aria-hidden="true"></canvas>
        </div>
      </section>

      <section id="screen-result" class="card screen" hidden>
        <p class="result-greeting">Woohoo!</p>
        <h2 id="result-name" class="result-name"></h2>
        <p class="result-label">You’re on team</p>
        <div id="result-badge" class="team-badge">
          <span id="result-team"></span>
        </div>
        <p class="result-note">Psst… keep your team a secret until the games kick off!</p>
      </section>
    </main>

    <script src="/js/app.js" type="module"></script>
  </body>
</html>
